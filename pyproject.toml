[project]
name = "specimen-measure"
version = "0.1.0"
description = "Scale-calibrated morphometry for photographed excised organ/tumor specimens"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "pillow>=10.0",
    "pandas>=2.0",
    "tifffile>=2023.7.10",
    "streamlit>=1.28",
    "streamlit-image-coordinates>=0.1.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
specimen-measure = "specimen_measure.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["specimen_measure*"]
