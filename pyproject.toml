[project]
name = "heart-measure"
version = "0.1.0"
description = "Scale-calibrated morphometry for photographed whole-heart specimens"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "pillow>=10.0",
    "pandas>=2.0",
    "tifffile>=2023.7.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
heart-measure = "heart_measure.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["heart_measure*"]
